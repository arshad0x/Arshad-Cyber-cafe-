<style>
:root{--bg:#F7F5EF;--card:#FFFFFF;--ink:#14213D;--mute:#5A6478;--line:#E1DDD0;--brand:#0B3D91;--accent:#F59E0B;--accentink:#1B1300;--chip:#ECE8DB;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1626;--card:#18223A;--ink:#EEF1F8;--mute:#9AA6C0;--line:#2A3657;--brand:#8DB4FF;--accent:#F5B53A;--accentink:#1B1300;--chip:#222E4C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1626;--card:#18223A;--ink:#EEF1F8;--mute:#9AA6C0;--line:#2A3657;--brand:#8DB4FF;--accent:#F5B53A;--accentink:#1B1300;--chip:#222E4C;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari","Nirmala UI",Roboto,sans-serif}
header{background:var(--brand);color:#fff;padding:18px 16px 14px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header{background:#13204A;color:#fff}}
:root[data-theme="dark"] header{background:#13204A}
h1{margin:0;font-size:22px;line-height:1.2}header p{margin:4px 0 0;font-size:14px;opacity:.9}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.bar::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:-1}
.s{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:17px;padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
input:focus{outline:none;border-color:var(--accent)}
button.x{border:0;border-radius:12px;padding:0 14px;background:var(--chip);color:var(--ink);font:inherit;font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;padding:7px 13px;background:var(--chip);color:var(--ink);font:inherit;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accentink);font-weight:700}
main{padding:10px 12px 40px;max-width:760px;margin:0 auto}
.count{color:var(--mute);font-size:14px;margin:4px 2px 10px}
h2{font-size:15px;margin:18px 2px 8px;color:var(--brand)}
a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
a.card:active,a.card:focus-visible{border-color:var(--accent);outline:2px solid var(--accent)}
.t{font-weight:700;font-size:16px}.d{font-size:15px;margin:3px 0 6px}
.u{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mute);align-items:center}
.u span:first-child{overflow-wrap:anywhere}.go{flex:none;background:var(--accent);color:var(--accentink);font-weight:700;border-radius:8px;padding:5px 12px;font-size:14px}
.tag{font-size:12px;color:var(--mute);margin-bottom:2px}
.empty{text-align:center;color:var(--mute);padding:36px 12px}
footer{text-align:center;color:var(--mute);font-size:12px;padding:0 16px 24px}
#lock{max-width:380px;margin:40px auto;padding:0 16px}#lock h2{font-size:20px;margin:0 0 4px;color:var(--ink)}#lock p{color:var(--mute);margin:0 0 14px}#err{color:#C62828;margin-top:10px;font-size:14px}[hidden]{display:none!important}</style></head><body>

const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function card(r){const host=r.u.replace(/^https?:\/\//,"");return '<a class="card" href="'+esc(r.u)+'" target="_blank" rel="noopener noreferrer"><div class="t">'+esc(r.n)+'</div><div class="d">'+esc(r.d)+'</div><div class="u"><span>'+esc(host)+'</span><span class="go">Kholein</span></div></a>'}
function match(r,toks){return toks.every(t=>{const a=AL[t];return r.h.includes(t)||(a&&r.h.includes(a))})}
function render(){
 const toks=q.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
 let rows=DATA.filter(r=>(cat==="Sab"||r.c===cat)&&match(r,toks));

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),T=new TextDecoder();
async function tryKey(key){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ENC.iv)},key,b64(ENC.ct));DATA=JSON.parse(T.decode(pt));DATA.forEach(r=>r.h=(r.n+" "+r.d+" "+r.u+" "+r.c).toLowerCase());$("lock").hidden=true;$("app").hidden=false;render()}
async function unlock(pw){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.salt),iterations:ENC.it,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
 await tryKey(key);try{localStorage.setItem("acc_k",btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey("raw",key)))))}catch(e){}}

 try{await unlock($("pw").value)}catch(x){$("err").textContent="Password galat hai. Dobara try karein."}$("go").disabled=false});
(async()=>{try{const k=localStorage.getItem("acc_k");if(k){const key=await crypto.subtle.importKey("raw",b64(k),"AES-GCM",false,["decrypt"]);await tryKey(key)}}catch(e){try{localStorage.removeItem("acc_k")}catch(_){}}})();
